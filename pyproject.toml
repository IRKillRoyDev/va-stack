[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "va-stack"
version = "0.2.0"
description = "Prepare (not file) VA disability claims from your own records."
requires-python = ">=3.10"
dependencies = [
    "pypdf==5.1.0",
    "reportlab==4.5.1",
    "PySide6-Essentials==6.12.0",
    "PySide6-Pdf==6.12.0.140",
    "sqlcipher3-binary==0.6.0; sys_platform == 'linux'",
    "sqlcipher3>=0.6.4; sys_platform == 'darwin'",
    "sqlcipher3==0.6.4; sys_platform == 'win32'",
    "argon2-cffi==25.1.0",
]

[project.scripts]
va-stack = "va_stack_app:main"

[tool.setuptools]
package-dir = { "" = "scripts" }
py-modules = [
    "app_paths",
    "form_fill",
    "identifier_blocklist",
    "local_search",
    "proposed_issues",
    "qt_ui",
    "records_vault",
    "review_session",
    "va_stack_app",
    "vault_ui",
]
