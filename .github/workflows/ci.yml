name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  citations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check every claim row has a CFR cite and a record cite
        run: python3 tests/check_citations.py
      - name: Validate plugin.json files parse and match
        run: python3 tests/check_plugin_json.py
      - name: Check claim-submission track step lists
        run: python3 tests/check_submission_tracks.py
      - name: Skill frontmatter present
        run: |
          for f in skills/*/SKILL.md; do
            head -1 "$f" | grep -qx -- '---' || { echo "$f missing frontmatter"; exit 1; }
            grep -q '^name: ' "$f" && grep -q '^description: ' "$f" || { echo "$f missing name/description"; exit 1; }
          done
      - name: claim-submission guardrails present
        run: |
          f=skills/claim-submission/SKILL.md
          grep -q 'never submits' "$f" && grep -q 'Step 0: Ask which track' "$f" && grep -q 'Track B2' "$f" && grep -q 'Track C' "$f" && grep -q 'Track A2' "$f" && grep -q 'PEBLO' "$f" && grep -q '§20.202' "$f" && grep -q '§3.155' "$f" || { echo "claim-submission guardrails missing"; exit 1; }
      - name: SAFETY.md disclaimer present
        run: |
          test -f SAFETY.md || { echo "SAFETY.md missing"; exit 1; }
          for s in "Not legal or medical advice" "No filing" "VA-accredited" "processed by the AI service" "dial 988, then press 1" "pattern-based and can miss"; do
            grep -qF "$s" SAFETY.md || { echo "SAFETY.md missing: $s"; exit 1; }
          done
          OVERCLAIM="HIPAA[- ]?compliant|zero retention|zero-retention|zero data retention|records stay local|never send records to an external service|anonymized|anonymised|de-identified|de identified|deidentified|fully private|completely private|100% private|no data leaves your computer|records never leave your computer|data stays on your device|nothing leaves your machine|HIPAAcompliant|stays? on your (computer|device|machine)|never leaves? your (computer|device|machine)|HIPAA[- ]?complian|zero[- ]?(data[- ]?)?retention|fully[- ]?private|100 ?(%|percent) private|\bde[- ]?identif|\bon[- ]device|never leaves? (the|this|your) [a-z]+|per ?cent private|entirely local"
          bash tests/overclaim_scan.sh "$OVERCLAIM"
      - name: Estimate notice present
        run: |
          N="Unofficial estimate, not a VA decision. It is likely to differ after the VA exam (C&P exam). Confirm with a VA-accredited representative."
          for f in SAFETY.md skills/proposed-issues/SKILL.md agents/va-claims.md; do
            grep -qF "$N" "$f" || { echo "$f missing estimate notice"; exit 1; }
          done
          grep -qF "insufficient evidence to estimate" skills/proposed-issues/SKILL.md
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries (PySide6)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0
      - name: Install pinned dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Flake8
        run: flake8 .
      - name: Pytest
        run: pytest -q
  gui-headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install xvfb and the Qt system libraries (PySide6)
        run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libxkbcommon0
      - name: Install pinned dependencies
        run: pip install -r requirements-dev.txt
      - name: va-stack entry point installs
        run: |
          python -m pip install -e .
          va-stack --help
      - name: Drive the app and review windows under Xvfb (with screenshots)
        env:
          VA_STACK_SHOTS: ${{ github.workspace }}/va-stack-shots
        run: |
          python -c "import PySide6.QtPdfWidgets, PySide6; print('PySide6', PySide6.__version__)"
          set -o pipefail
          xvfb-run -a pytest -v -rs tests/test_gui_headless.py tests/test_app_gui.py tests/test_qt_gui.py | tee gui.txt
          grep -q "14 passed" gui.txt
          ls -l "$VA_STACK_SHOTS"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: va-stack-shots
          path: va-stack-shots/
          if-no-files-found: error
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install as in README (macOS)
        shell: bash
        run: |
          python3 --version
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install -e .
          python -c "import sqlcipher3; print(sqlcipher3.connect(':memory:').execute('PRAGMA cipher_version').fetchone()[0])"
          va-stack --help
          python -m pip install -r requirements-dev.txt
      - name: Vault opens encrypted (SQLCipher, not plain sqlite3)
        shell: bash
        run: |
          source .venv/bin/activate
          python -m pip show sqlcipher3
          python -m pytest -v -s -rs tests/test_encryption.py
      - name: Pytest (PySide6 window tests run offscreen)
        shell: bash
        env:
          VA_STACK_SHOTS: ${{ github.workspace }}/va-stack-shots
        run: |
          source .venv/bin/activate
          python -m pytest -q -rs
      - name: Upload screenshots (PySide6, offscreen)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: va-stack-shots-macos
          path: va-stack-shots/
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    env:
      PY_PYTHON: "3.12"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install as in README (Windows PowerShell)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          py --version
          py -m venv .venv
          .venv\Scripts\Activate.ps1
          python -m pip install -e .
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -c "import sqlcipher3; print(sqlcipher3.connect(':memory:').execute('PRAGMA cipher_version').fetchone()[0])"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          va-stack --help
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Vault opens encrypted (SQLCipher, not plain sqlite3)
        shell: pwsh
        run: |
          .venv\Scripts\Activate.ps1
          python -m pip show sqlcipher3
          python -m pytest -v -s -rs tests/test_encryption.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Pytest (PySide6 window tests run offscreen)
        shell: pwsh
        env:
          VA_STACK_SHOTS: ${{ github.workspace }}/va-stack-shots
        run: |
          # Use Git Bash for the shell-script checks, not the WSL bash.exe stub.
          $env:PATH = "C:\Program Files\Git\bin;" + $env:PATH
          .venv\Scripts\Activate.ps1
          python -m pytest -q -rs
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Upload screenshots (PySide6, offscreen)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: va-stack-shots-windows
          path: va-stack-shots/
          if-no-files-found: error
  setup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PY_PYTHON: "3.12"
      VA_STACK_NO_LAUNCH: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries (PySide6, Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0
      - name: Setup twice keeps the vault (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bash setup.sh --no-launch
          test -x start-va-stack.sh && test -x "Start VA Stack.command"
          state="$RUNNER_TEMP/vault-state.json"
          .venv/bin/python tests/ci_vault_hash.py create "$state"
          bash setup.sh --no-launch
          .venv/bin/python tests/ci_vault_hash.py check "$state"
          .venv/bin/python -c "import PySide6.QtPdfWidgets; print('PySide6 ok')"
      - name: Setup twice keeps the vault (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\setup.ps1 -NoLaunch
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $state = Join-Path $env:RUNNER_TEMP "vault-state.json"
          .venv\Scripts\python.exe tests\ci_vault_hash.py create $state
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\setup.ps1 -NoLaunch
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .venv\Scripts\python.exe tests\ci_vault_hash.py check $state
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .venv\Scripts\python.exe -c "import PySide6.QtPdfWidgets; print('PySide6 ok')"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Pytest setup-twice test (scratch copy, isolated per-user folder)
        shell: bash
        env:
          VA_STACK_SETUP_TEST: "1"
        run: |
          py=.venv/bin/python
          if [ "$RUNNER_OS" = "Windows" ]; then py=.venv/Scripts/python.exe; fi
          "$py" -m pip install pytest==8.3.3
          "$py" -m pytest -v -rs tests/test_setup_twice.py
